<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Photo SaaS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
    <main class="app-shell">
        <section class="auth-panel" id="auth-panel">
            <div class="brand">
                <p class="eyebrow">Photo-only MVP</p>
                <h1>Event Photo SaaS</h1>
                <p class="subtitle">
                    Organizators izveido pasākumu, viesi augšupielādē foto ar QR saiti.
                </p>
            </div>

            <div class="mode-tabs" role="tablist" aria-label="Autentifikācijas režīms">
                <button class="mode-tab is-active" id="login-tab" type="button">Login</button>
                <button class="mode-tab" id="register-tab" type="button">Register</button>
            </div>

            <form class="auth-form" id="auth-form">
                <label for="email">E-pasts</label>
                <input id="email" type="email" autocomplete="email" required>

                <label for="password">Parole</label>
                <input id="password" type="password" autocomplete="current-password" minlength="6" required>

                <button class="primary-button" id="submit-button" type="submit">Login</button>
            </form>

            <p class="form-hint" id="form-hint">
                Pieslēdzies kā organizators, lai vēlāk pārvaldītu savus pasākumus.
            </p>
        </section>

        <section class="dashboard-panel hidden" id="dashboard-panel">
            <div>
                <p class="eyebrow">Organizer dashboard</p>
                <h1>Sveiks!</h1>
                <p class="subtitle" id="user-email"></p>
            </div>

            <div class="status-list">
                <div>
                    <span>Supabase Auth</span>
                    <strong>Connected</strong>
                </div>
                <div>
                    <span>Nākamais solis</span>
                    <strong>Event management</strong>
                </div>
            </div>

            <button class="secondary-button" id="logout-button" type="button">Logout</button>
        </section>

        <div class="message hidden" id="message" role="status"></div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
